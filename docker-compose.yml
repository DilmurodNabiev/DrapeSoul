# Optimized for 1 GB RAM VPS + Cloudflare SSL (no certbot)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=50
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=128MB
    environment:
      POSTGRES_USER: drapesoul
      POSTGRES_PASSWORD: drapesoul_secret
      POSTGRES_DB: drapesoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drapesoul"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 64m
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 300m
    env_file: .env
    volumes:
      - ./backend/static/uploads:/app/static/uploads
      - ./backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_URL:-https://api.drapesoul.uz}
        VITE_APP_NAME: ${APP_NAME:-DrapeSoul}
    restart: unless-stopped
    mem_limit: 64m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
